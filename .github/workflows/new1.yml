name: Тест CI/CD
on:
  workflow_dispatch:

jobs:
  ui-tests:
    name: Параллельные автотесты на Firefox
    runs-on: ubuntu-latest

    steps:
      - name: Проверка кода репозитория
        uses: actions/checkout@v6

      - name: Сборка Docker образа
        run: docker build -t python-ui-testing:latest .

      - name: Запуск UI тестов
        run: |
          docker run --rm -v ${{ github.workspace }}:/docker/project python-ui-testing:latest \
            /bin/sh -c "pytest --headless --firefox --screenshot-every-time -n=auto --reruns=3 --reruns-delay=5"

      - name: Создание Allure отчета
        if: always()
        run: |
          docker run --rm -v ${{ github.workspace }}:/docker/project python-ui-testing:latest \
            /bin/sh -c "allure generate allure-data -c --single-file"

      - name: Выгрузка Allure отчёта
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: allure-report
          path: allure-report
