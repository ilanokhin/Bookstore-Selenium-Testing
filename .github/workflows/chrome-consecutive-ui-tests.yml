name: Последовательные автотесты на Chrome

on:
  workflow_dispatch:

jobs:
  ui-tests:
    name: Последовательные автотесты на Chrome
    runs-on: ubuntu-latest

    steps:
      - name: Проверка кода репозитория
        uses: actions/checkout@v6

      - name: Загрузка образа с Docker Hub
        run: docker pull ilanokhin/python-ui-testing:latest

      - name: Запуск UI тестов
        run: |
          docker run --rm -v ${{ github.workspace }}:/docker/project ilanokhin/python-ui-testing:latest \
            /bin/sh -c "pytest --headless --reruns=3 --reruns-delay=5"

      - name: Создание Allure отчета
        if: always()
        run: |
          docker run --rm -v ${{ github.workspace }}:/docker/project ilanokhin/python-ui-testing:latest \
            /bin/sh -c "allure generate allure-data -c --single-file"

      - name: Выгрузка Allure отчёта
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: allure-report
          path: allure-report
