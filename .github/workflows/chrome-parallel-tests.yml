name: Параллельные автотесты на Chrome

on:
  workflow_dispatch:
  pull_request:
    branches:
      - master

jobs:
  chrome-tests:
    name: Автотесты на Chrome
    runs-on: ubuntu-latest

    steps:
      - name: Проверка кода репозитория
        uses: actions/checkout@v6

      - name: Загрузка образа с Docker Hub
        run: |
          docker pull ilanokhin/python-selenium-chrome-testing:latest
          docker tag ilanokhin/python-selenium-chrome-testing:latest python-selenium-chrome-testing:latest

      - name: Запуск автотестов
        run: |
          docker run --rm -v ${{ github.workspace }}:/docker/project python-selenium-chrome-testing:latest \
            /bin/sh -c "pytest --headless -n=auto"

      - name: Создание Allure отчёта
        if: always()
        run: |
          docker run --rm -v ${{ github.workspace }}:/docker/project python-selenium-chrome-testing:latest \
            /bin/sh -c "allure generate allure-data -c --single-file"

      - name: Выгрузка Allure отчёта
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: allure-report
          path: allure-report
