name: Последовательные автотесты на Chrome

on:
  workflow_dispatch:

jobs:
  chrome-tests:
    name: Автотесты на Chrome
    runs-on: ubuntu-latest

    steps:
      - name: Проверка кода репозитория
        uses: actions/checkout@v7

      - name: Настройка Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Восстановление и сборка Chrome образа из кэша
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile_for_chrome
          load: true
          tags: python-selenium-chrome-testing:latest
          cache-from: type=gha

      - name: Запуск автотестов
        run: |
          docker run --rm -v ${{ github.workspace }}:/docker/project python-selenium-chrome-testing:latest \
            /bin/sh -c "pytest --headless"

      - name: Создание Allure отчёта
        if: always()
        run: |
          docker run --rm -v ${{ github.workspace }}:/docker/project ilanokhin/python-selenium-chrome-testing:latest \
            /bin/sh -c "allure generate allure-data -c --single-file"

      - name: Выгрузка Allure отчёта
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: allure-report
          path: allure-report
