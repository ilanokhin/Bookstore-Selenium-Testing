name: Последовательные автотесты на Chrome

on:
  workflow_dispatch:

jobs:
  chrome-tests:
    name: Автотесты на Chrome
    runs-on: ubuntu-latest

    steps:
      - name: Проверка кода репозитория
        uses: actions/checkout@v6

      - name: Восстановление образа из кэша
        id: cache-restore
        uses: actions/cache/restore@v6
        with:
          path: chrome.tar
          key: python-selenium-chrome-testing

      - name: Загрузка образа в Docker (если есть в кэше)
        if: steps.cache-restore.outputs.cache-hit == 'true'
        run: |
          docker load < chrome.tar
          docker tag ilanokhin/python-selenium-chrome-testing:latest python-selenium-chrome-testing:latest

      - name: Загрузка образа с Docker Hub (если нет в кэше)
        if: steps.cache-restore.outputs.cache-hit != 'true'
        run: |
          docker pull ilanokhin/python-selenium-chrome-testing:latest
          docker tag ilanokhin/python-selenium-chrome-testing:latest python-selenium-chrome-testing:latest

      - name: Запуск автотестов
        run: |
          docker run --rm -v ${{ github.workspace }}:/docker/project python-selenium-chrome-testing:latest \
            /bin/sh -c "pytest --headless"

      - name: Создание Allure отчёта
        if: always()
        run: |
          docker run --rm -v ${{ github.workspace }}:/docker/project ilanokhin/python-selenium-chrome-testing:latest \
            /bin/sh -c "allure generate allure-data -c --single-file"

      - name: Выгрузка Allure отчёта
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: allure-report
          path: allure-report
