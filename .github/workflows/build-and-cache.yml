name: Сборка и кэширование образов

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Проверка кода репозитория
        uses: actions/checkout@v6

      - name: Настройка Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Кэш слоёв Docker для Chrome
        uses: actions/cache@v6
        with:
          path: /tmp/.buildx-cache-chrome
          key: ${{ runner.os }}-buildx-chrome-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-buildx-chrome-

      - name: Сборка Chrome образа
        id: chrome-build
        continue-on-error: true
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile_for_chrome
          load: true
          tags: python-selenium-chrome-testing:latest
          cache-from: type=local,src=/tmp/.buildx-cache-chrome
          cache-to: type=local,dest=/tmp/.buildx-cache-chrome-new,mode=max

      - name: Обновление кэша Chrome
        if: always()
        run: |
          rm -rf /tmp/.buildx-cache-chrome
          mv /tmp/.buildx-cache-chrome-new /tmp/.buildx-cache-chrome
