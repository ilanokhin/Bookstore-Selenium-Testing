name: Сборка и кэширование образов

on:
  workflow_dispatch:

jobs:
  tar-archives:
    name: Создание TAR архивов
    runs-on: ubuntu-latest

    steps:
      - name: Проверка кода репозитория
        uses: actions/checkout@v6

      - name: Сборка Docker образа
        run: |
          docker build -t python-selenium-chrome-testing:latest -f ./Dockerfile_for_chrome .
          docker save python-selenium-chrome-testing:latest > chrome.tar

      - name: Сохранение собранного образа Chrome в кэш
        uses: actions/cache/save@v6
        with:
          path: chrome.tar
          key: python-selenium-chrome-testing