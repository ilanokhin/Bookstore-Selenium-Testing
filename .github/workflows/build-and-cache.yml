name: Сборка и кэширование образов

on:
  workflow_dispatch:

jobs:
  build-and-cache:
    name: Сборка и кэширование образов
    runs-on: ubuntu-latest

    steps:
      - name: Проверка кода репозитория
        uses: actions/checkout@v6

      - name: Сборка Docker образа Chrome
        run: |
          docker build -t python-selenium-chrome-testing:latest -f ./Dockerfile_for_chrome .
          docker save python-selenium-chrome-testing:latest > chrome.tar

      - name: Сохранение собранного образа Chrome в кэш
        uses: actions/cache/save@v6
        with:
          path: chrome.tar
          key: python-selenium-chrome-testing

      - name: Сборка Docker образа Firefox
        run: |
          docker build -t python-selenium-firefox-testing:latest -f ./Dockerfile_for_firefox .
          docker save python-selenium-firefox-testing:latest > firefox.tar

      - name: Сохранение собранного образа Firefox в кэш
        uses: actions/cache/save@v6
        with:
          path: firefox.tar
          key: python-selenium-firefox-testing