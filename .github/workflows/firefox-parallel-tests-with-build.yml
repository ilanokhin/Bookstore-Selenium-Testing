name: Параллельные автотесты на Firefox со сборкой

on:
  workflow_dispatch:

jobs:
  firefox-tests:
    name: Автотесты на Firefox
    runs-on: ubuntu-latest

    steps:
      - name: Проверка кода репозитория
        uses: actions/checkout@v6

      - name: Сборка Docker образа
        run: docker build -t python-selenium-firefox-testing:latest -f ./Dockerfile_for_firefox .
        
      - name: Запуск автотестов
        run: |
          docker run --rm -v ${{ github.workspace }}:/docker/project python-selenium-firefox-testing:latest \
            /bin/sh -c "pytest --headless --firefox -n=auto"

      - name: Создание Allure отчёта
        if: always()
        run: |
          docker run --rm -v ${{ github.workspace }}:/docker/project python-selenium-firefox-testing:latest \
            /bin/sh -c "allure generate allure-data -c --single-file"

      - name: Выгрузка Allure отчёта
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: allure-report
          path: allure-report
